openapi: 3.1.0
info:
  title: DTF API — комментарии
  version: 2026-11-02
servers:
  - url: https://api.dtf.ru
tags:
  - name: Комментарии
    description: Комментарии и реакции.
paths:
  /v2.10/comments:
    get:
      tags: [Комментарии]
      operationId: getComments
      security: [{}, { JWTAuthorization: [] }]
      summary: Комментарии поста
      description: |
        Плоский список с `level` и `replyTo`, дерево собирает клиент. На `/v2.31/comments` приходит
        только `items` (без `editor` и `lastVisit`), поэтому reDTF и сайт используют `/v2.10`.

        Обновления комментариев в реальном времени (новые комментарии, правки, реакции)
        передаются через WebSocket, см. docs/realtime.md.

        Закрытый пост (чужой черновик) отвечает 403 «Хорошие новости, мы не забыли проверку на права доступа».
      x-status: verified
      x-evidence: [app, har, probe]
      x-checked: '2026-11-02'
      parameters:
        - name: contentId
          in: query
          required: true
          schema: { type: integer }
        - name: sorting
          in: query
          schema: { type: string, enum: [date, popular], default: date }
        - name: firstLoad
          in: query
          schema: { type: boolean }
          description: Так делает сайт при первой загрузке; смысл не выяснялся.
        - name: lastId
          in: query
          schema: { type: integer }
        - name: lastSortingValue
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Комментарии.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: ./shared/schemas.yaml#/Comment } }
                      editor:
                        type: object
                        description: Можно ли писать комментарии.
                        properties:
                          enabled: { type: boolean }
                      lastVisit: { type: [integer, 'null'] }
                      lastId: { type: integer }
                      lastSortingValue: { type: number }
        '403': { $ref: ./shared/security.yaml#/Forbidden }
  /v2.10/comment/{id}/react:
    post:
      tags: [Комментарии]
      operationId: reactToComment
      summary: Поставить реакцию на комментарий
      description: |
        `type` — номер реакции, `0` снимает свою. Сайт дополнительно шлёт `location`, `previousPage`,
        `fromFeed`, `hitId` (аналитика); reDTF отправляет только `type`.

        Заблокированному пользователю отвечает 403 `USER_BANNED`.
      x-status: verified
      x-evidence: [app, har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: integer, description: Номер реакции (`1` — лайк). }
                location: { type: string, examples: [post] }
                previousPage: { type: string }
                fromFeed: { type: string }
                hitId: { type: string }
      responses:
        '200':
          description: Реакции комментария после запроса.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Reactions }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
        '403': { $ref: ./shared/security.yaml#/Forbidden }
  /v2.1/comment/banned/{id}:
    get:
      tags: [Комментарии]
      operationId: getBannedComment
      summary: Удалённый комментарий, из-за которого заблокировали
      description: |
        Адрес берётся из уведомления о блокировке: `meta.entityId` при `meta.entityType=comment`.
        Отдаёт комментарий целиком (автор, текст, медиа, пост).
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Комментарий.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Comment }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.4/comment/add:
    post:
      tags: [Комментарии]
      operationId: addComment
      summary: Написать комментарий
      description: |
        Возвращает созданный комментарий целиком (с `textMd`, `etcControls`, `nonce`). Для ответа в `reply_to` кладут
        id комментария, для корневого — `0`. `nonce` — случайное число, сервер возвращает его обратно.
        `attachments` — JSON-массив вложений в виде строки, без вложений — `[]`. Вложение — тот же объект,
        что приходит в `media` комментария: `{ type: image|movie, data: { uuid, width, height, size, type, color,
        hash, external_service, base64preview, isVideo, duration, has_audio } }`. `uuid` берут из ответа загрузчика
        (`uploadMedia`) или из избранных гифок. Текст при вложении может быть пустым.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: ./shared/schemas.yaml#/ViewContext
                - type: object
                  required: [id, text, attachments, reply_to]
                  properties:
                    id: { type: integer, description: id поста. }
                    text: { type: string }
                    attachments: { type: string, examples: ['[]'] }
                    reply_to: { type: integer }
                    nonce: { type: integer }
      responses:
        '200':
          description: Созданный комментарий.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Comment }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
        '403': { $ref: ./shared/security.yaml#/Forbidden }
  /v2.4/comment/edit:
    post:
      tags: [Комментарии]
      operationId: editComment
      summary: Изменить свой комментарий
      description: |
        Можно ли править комментарий, говорит `etcControls.edit` (см. `getCommentControls`). Отвечает комментарием
        целиком, как `addComment`. Вложения нужно отправить снова (`attachments` в том же формате), иначе правка их уберёт. Удаления комментариев на сайте нет.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [comment_id, text, attachments]
              properties:
                comment_id: { type: integer }
                text: { type: string }
                attachments: { type: string, examples: ['[]'] }
      responses:
        '200':
          description: Комментарий после правки.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Comment }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
        '403': { $ref: ./shared/security.yaml#/Forbidden }
  /v2.1/comment/etcControls:
    get:
      tags: [Комментарии]
      operationId: getCommentControls
      summary: Какие действия доступны над комментарием
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: commentId, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Доступные действия.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      etcControls:
                        type: object
                        properties:
                          edit: { type: boolean }
                          remove: { type: boolean }
                          remove_thread: { type: boolean }
                          pin_comment: { type: boolean }
                          moderate: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.4/comment/complaint:
    post:
      tags: [Комментарии]
      operationId: complainAboutComment
      summary: Пожаловаться на комментарий
      description: "Причины (`reason_id`): `1` спам, `2` оскорбление, `3` нарушение закона, `4` порнографический контент, `5` насилие, `6` авторские права, `7` введение в заблуждение, `8` другое, `9` политика, `10` нейроконтент. Список один на посты и комментарии."
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [comment_id, reason_id]
              properties:
                comment_id: { type: integer }
                reason_id: { type: integer }
      responses:
        '200':
          description: Жалоба принята.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.5/comment/{id}/donations:
    get:
      tags: [Комментарии]
      operationId: getCommentDonations
      summary: Донаты комментарию
      description: В записи список был пустым, вид элемента не снят.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{}, { JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, examples: [100] } }
      responses:
        '200':
          description: Донаты.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      donations: { type: array, items: { type: object } }
                      cursor: { type: [string, 'null'] }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.5/comments:
    get:
      tags: [Комментарии]
      operationId: getSubsiteComments
      summary: Комментарии пользователя
      description: |
        Вкладка «Комментарии» в профиле. Плоский список, у каждого комментария `entry` (пост), `threadId`
        и `replyCount`. Следующая страница — по `lastId` и `lastSortingValue`; сайт при этом шлёт `page`.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{}, { JWTAuthorization: [] }]
      parameters:
        - { name: subsiteId, in: query, required: true, schema: { type: integer } }
        - { name: sorting, in: query, schema: { type: string, enum: [new], default: new }, description: Другие значения не снимались. }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: lastId, in: query, schema: { type: integer } }
        - { name: lastSortingValue, in: query, schema: { type: number } }
      responses:
        '200':
          description: Комментарии, свежие сверху.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: ./shared/schemas.yaml#/Comment } }
                      lastId: { type: integer }
                      lastSortingValue: { type: number }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.9/favorite-gifs:
    get:
      tags: [Комментарии]
      operationId: getFavoriteGifs
      summary: Избранные гифки
      description: |
        Меню гифок в редакторе комментария. В `andropov` лежит готовое вложение (формат из `addComment`),
        в `leonardoUuid` — uuid файла.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, examples: [6] } }
      responses:
        '200':
          description: Избранные гифки, недавно использованные первыми.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            leonardoUuid: { type: string }
                            tenorId: { type: [string, 'null'] }
                            dateLastUsedTimestamp: { type: integer }
                            width: { type: integer }
                            height: { type: integer }
                            andropov: { type: object }
                      cursor: { type: [string, 'null'] }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/gifs/search:
    get:
      tags: [Комментарии]
      operationId: searchGifs
      summary: Поиск гифок
      description: |
        У каждой гифки `id` (uuid файла на leonardo) и `media_formats` (`gif`, `tinygif`, `mp4`) с `dims`,
        `size`, `duration`. Как найденная гифка превращается во вложение комментария, не снималось.
        Следующая страница — по `cursor` из ответа.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: mediaFilter, in: query, schema: { type: string, examples: ['gif,tinygif,nanogif'] } }
        - { name: limit, in: query, schema: { type: integer, examples: [18] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Найденные гифки.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { type: object } }
                      cursor: { type: [string, 'null'] }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.6/donations/donate:
    post:
      tags: [Комментарии]
      operationId: donateWithComment
      summary: Комментарий с донатом
      description: |
        Вместо `addComment`. Комментарий уходит в `data[...]` теми же полями, что в `addComment`
        (`data[id]`, `data[text]`, `data[attachments]`, `data[reply_to]`, `data[nonce]` и аналитика), сумма — в `donation`.
        Сервер отвечает ссылкой на оплату (CloudTips); комментарий появляется после оплаты.
        Минимальная и максимальная сумма не снимались.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: ./shared/schemas.yaml#/ViewContext
                - type: object
                  required: [type, donation]
                  properties:
                    type: { type: string, enum: [comment] }
                    donation: { type: integer, description: Сумма в рублях. }
                    'data[id]': { type: integer, description: id поста. }
                    'data[text]': { type: string }
                    'data[attachments]': { type: string, examples: ['[]'] }
                    'data[reply_to]': { type: integer }
                    'data[nonce]': { type: integer }
      responses:
        '200':
          description: Платёж создан.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      payment_link: { type: string, format: uri }
                      layout_id: { type: string }
                      invoice_id: { type: string }
                      sum: { type: string }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.51/search/comments:
    get:
      tags: [Комментарии]
      operationId: searchComments
      security: [{}, { JWTAuthorization: [] }]
      summary: Поиск по комментариям (полные объекты)
      description: |
        Возвращает полные объекты комментариев (`items` по 12 штук на страницу) и фрагмент совпадения в `meta.highlight`
        с тегами `<mark>`. Параметр `q` необязателен, если передан `author`. Пагинация — через `page` (начиная с 1);
        `lastId` и `lastSortingValue` приходят в ответе, но при передаче в запрос сервером игнорируются.
      x-status: verified
      x-evidence: [probe]
      x-checked: '2026-11-14'
      parameters:
        - { $ref: '#/components/parameters/commentSearchQ' }
        - { $ref: '#/components/parameters/commentSearchSorting' }
        - { $ref: '#/components/parameters/commentSearchStrict' }
        - { $ref: '#/components/parameters/commentSearchAuthor' }
        - { $ref: '#/components/parameters/commentSearchPage' }
      responses:
        '200':
          description: Найденные комментарии.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { type: string, enum: [comment] }
                            data: { $ref: ./shared/schemas.yaml#/Comment }
                            meta:
                              type: object
                              properties:
                                highlight: { type: string }
                      lastId: { type: integer }
                      lastSortingValue: { type: number }
                      total: { type: integer }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.31/search/comments:
    get:
      tags: [Комментарии]
      operationId: searchCommentsV231
      security: [{}, { JWTAuthorization: [] }]
      summary: Поиск по комментариям (короткий формат v2.31)
      description: |
        Принимает те же параметры, что и `/v2.51/search/comments`, но возвращает только `total` и массив `matches`
        с `id` комментария и `highlight`.
      x-status: verified
      x-evidence: [probe]
      x-checked: '2026-11-14'
      parameters:
        - { $ref: '#/components/parameters/commentSearchQ' }
        - { $ref: '#/components/parameters/commentSearchSorting' }
        - { $ref: '#/components/parameters/commentSearchStrict' }
        - { $ref: '#/components/parameters/commentSearchAuthor' }
        - { $ref: '#/components/parameters/commentSearchPage' }
      responses:
        '200': { $ref: '#/components/responses/CommentSearchMatches' }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.10/search/comments:
    get:
      tags: [Комментарии]
      operationId: searchCommentsV210
      security: [{}, { JWTAuthorization: [] }]
      summary: Поиск по комментариям (короткий формат v2.10)
      description: |
        Ответ и параметры совпадают с `/v2.31/search/comments`: возвращает `total` и `matches` (`id`, `highlight`).
      x-status: verified
      x-evidence: [probe]
      x-checked: '2026-11-14'
      parameters:
        - { $ref: '#/components/parameters/commentSearchQ' }
        - { $ref: '#/components/parameters/commentSearchSorting' }
        - { $ref: '#/components/parameters/commentSearchStrict' }
        - { $ref: '#/components/parameters/commentSearchAuthor' }
        - { $ref: '#/components/parameters/commentSearchPage' }
      responses:
        '200': { $ref: '#/components/responses/CommentSearchMatches' }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
components:
  securitySchemes:
    JWTAuthorization: { $ref: ./shared/security.yaml#/JWTAuthorization }
  parameters:
    commentSearchQ:
      name: q
      in: query
      schema: { type: string }
      description: Поисковый запрос; необязателен при указании `author`.
    commentSearchSorting:
      name: sorting
      in: query
      schema: { type: string, enum: [relevance, date], default: relevance }
    commentSearchStrict:
      name: strict
      in: query
      schema: { type: boolean }
      description: Точное совпадение (в живой проверке работает и `1`).
    commentSearchAuthor:
      name: author
      in: query
      schema: { type: integer }
      description: ID автора комментариев.
    commentSearchPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Номер страницы (с 1, по 12 результатов).
  responses:
    CommentSearchMatches:
      description: Совпадения в комментариях.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              result:
                type: object
                properties:
                  total: { type: integer }
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        highlight: { type: string }
