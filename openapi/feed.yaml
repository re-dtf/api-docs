openapi: 3.1.0
info:
  title: DTF API — ленты, новости, поиск
  version: 2026-11-09
  description: |
    Чтение работает без токена; с токеном в записях появляются личные поля (`isFavorited`,
    `commentsSeenCount`, свой голос в `likes`).

    **Версии.** Один и тот же путь отвечает на нескольких версиях, и формы различаются. Для ленты
    это существенно: `/v2.31/feed` и `/v2.1/feed` отдают курсор парой `lastId` + `lastSortingValue`,
    `/v2.10/feed` — одной непрозрачной строкой `cursor`. reDTF использует `/v2.31`.
servers:
  - url: https://api.dtf.ru
tags:
  - name: Ленты
    description: Ленты, новости, поиск.
paths:
  /v2.31/feed:
    get:
      tags: [Ленты]
      operationId: getFeed
      security: [{}, { JWTAuthorization: [] }]
      summary: Лента
      description: |
        Постраничная лента. Следующая страница: `lastId` и `lastSortingValue` из прошлого ответа.
        Значения `sorting`, кроме `hotness`, в этой спецификации не проверены.
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-02'
      parameters:
        - name: pageName
          in: query
          schema: { type: string, enum: [popular, new, my], default: popular }
          description: "`my` — моя лента, нужен токен."
        - name: sorting
          in: query
          schema: { type: string, default: hotness, examples: [hotness] }
        - name: isWithoutNews
          in: query
          schema: { type: boolean }
          description: Убрать новости редакции из популярного; их отдаёт `/news`.
        - { $ref: '#/components/parameters/lastId' }
        - { $ref: '#/components/parameters/lastSortingValue' }
      responses:
        '200':
          description: Страница ленты.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: ./shared/schemas.yaml#/FeedItem } }
                      lastId: { type: integer }
                      lastSortingValue: { type: number }
                      excludeIds: { type: array, items: { type: integer } }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.10/feed:
    get:
      tags: [Ленты]
      operationId: getFeedV210
      security: [{}, { JWTAuthorization: [] }]
      summary: Лента (версия с одним курсором)
      description: |
        Так ходит сайт DTF. Курсор отдаётся одной строкой `result.cursor`, без пары `lastId`/`lastSortingValue`.
        Как передать курсор следующим запросом, в HAR не видно (там только первая страница).
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      parameters:
        - name: pageName
          in: query
          schema: { type: string, enum: [popular, new, my] }
        - name: sorting
          in: query
          schema: { type: string, examples: [hotness] }
        - name: isWithoutNews
          in: query
          schema: { type: boolean }
        - name: markdown
          in: query
          schema: { type: boolean }
          description: "`false` — текст блоков без markdown-обработки."
      responses:
        '200':
          description: Страница ленты.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: ./shared/schemas.yaml#/FeedItem } }
                      cursor: { type: string }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.10/recommendations:
    get:
      tags: [Ленты]
      operationId: getRecommendations
      security: [{}, { JWTAuthorization: [] }]
      summary: Рекомендации под постом
      description: |
        Лента рекомендаций, которую сайт DTF показывает после комментариев к посту. Работает без токена;
        сайт ходит с токеном, и тогда выдача персональная.

        **Постраничность.** Страница — 12 записей. Следующую страницу даёт только пара `lastId` +
        `excludeIds` из прошлого ответа. `excludeIds` — непрозрачная base64-строка (около 44 символов,
        меняется и растёт со страницами), содержит `+` и `/`, поэтому в запросе её нужно URL-кодировать.
        Только `lastId` без `excludeIds` (как и запрос без обоих) сервер игнорирует и отдаёт первую
        страницу заново. На трёх страницах подряд повторов записей не было; сам пост `contentId` в выдаче
        не встречался.

        Влияние `previousPage` на выдачу не проверялось: сайт шлёт `post`, и этого достаточно.
      x-status: verified
      x-evidence: [har, probe]
      x-checked: '2026-11-09'
      parameters:
        - name: contentId
          in: query
          required: true
          schema: { type: integer }
          description: id поста, под которым показываются рекомендации.
        - name: markdown
          in: query
          schema: { type: boolean }
          description: "`false` — текст блоков без markdown-обработки (так шлёт сайт)."
        - name: previousPage
          in: query
          schema: { type: string, examples: [post] }
          description: Откуда пришли. Сайт шлёт `post`; влияние на выдачу не проверялось.
        - name: lastId
          in: query
          schema: { type: string }
          description: "`result.lastId` из прошлого ответа (строка); работает только вместе с `excludeIds`."
        - name: excludeIds
          in: query
          schema: { type: string }
          description: "`result.excludeIds` из прошлого ответа, URL-кодированная (в значении есть `+` и `/`)."
      responses:
        '200':
          description: Страница рекомендаций.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/RecommendationItem' } }
                      lastId:
                        type: string
                        description: "Строка, а не число (в отличие от `lastId` в `/v2.31/feed`)."
                        examples: ['5397840']
                      excludeIds:
                        type: string
                        description: Непрозрачная base64-строка, передаётся в следующий запрос как есть.
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.31/news:
    get:
      tags: [Ленты]
      operationId: getNews
      security: [{}, { JWTAuthorization: [] }]
      summary: Новости редакции
      description: Порция новостей. Следующая — с `lastId` из прошлого ответа; первая — `lastId=0` или без параметра.
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-02'
      parameters:
        - { $ref: '#/components/parameters/lastId' }
      responses:
        '200':
          description: Новости.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      news: { type: array, items: { $ref: ./shared/schemas.yaml#/FeedItem } }
                      lastId: { type: integer }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.31/news/min:
    get:
      tags: [Ленты]
      operationId: getNewsMin
      security: [{}, { JWTAuthorization: [] }]
      summary: Пять свежих новостей
      description: Короткий список без пагинации. Записи лежат в массиве напрямую, без обёртки `data`.
      x-status: verified
      x-evidence: [probe]
      x-checked: '2026-11-02'
      responses:
        '200':
          description: Массив записей.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { type: array, items: { $ref: ./shared/schemas.yaml#/Entry } }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.31/timeline:
    get:
      tags: [Ленты]
      operationId: getTimeline
      security: [{}, { JWTAuthorization: [] }]
      summary: Записи подсайта или пользователя
      description: Лента одного или нескольких подсайтов (вкладки профиля).
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-02'
      parameters:
        - name: subsitesIds
          in: query
          required: true
          schema: { type: integer }
          description: id подсайта. Несколько значений через запятую не проверялось.
        - name: sorting
          in: query
          schema: { type: string, enum: [date, hotness], default: date }
        - { $ref: '#/components/parameters/lastId' }
        - { $ref: '#/components/parameters/lastSortingValue' }
      responses:
        '200':
          description: Страница записей.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: ./shared/schemas.yaml#/FeedItem } }
                      lastId: { type: integer }
                      lastSortingValue: { type: number }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.10/search/posts:
    get:
      tags: [Ленты]
      operationId: searchPosts
      security: [{}, { JWTAuthorization: [] }]
      summary: Поиск по записям
      description: |
        Поиск записей с фильтрами (`title`, `editorial`, `strict`, `author`). Параметр `q` необязателен при указании
        `author`. У каждого элемента ответа приходит `meta.highlight` с тегами `<mark>` (начинается с заголовка записи,
        дальше без разделителя идёт текст). Постраничность — через `lastId` и `lastSortingValue`.
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-14'
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Поисковый запрос; необязателен при указании `author`.
        - name: sorting
          in: query
          schema: { type: string, enum: [relevance, date], default: relevance }
        - name: title
          in: query
          schema: { type: boolean }
          description: Искать только в заголовках.
        - name: editorial
          in: query
          schema: { type: boolean }
          description: Только материалы редакции.
        - name: strict
          in: query
          schema: { type: boolean }
          description: Точное совпадение.
        - name: author
          in: query
          schema: { type: integer }
          description: ID автора записей.
        - name: markdown
          in: query
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/lastId' }
        - { $ref: '#/components/parameters/lastSortingValue' }
      responses:
        '200':
          description: Найденные записи.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: ./shared/schemas.yaml#/FeedItem
                            - type: object
                              properties:
                                meta:
                                  type: object
                                  properties:
                                    highlight: { type: string }
                      lastId: { type: integer }
                      lastSortingValue: { type: number }
                      total: { type: integer }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.31/search:
    get:
      tags: [Ленты]
      operationId: search
      security: [{}, { JWTAuthorization: [] }]
      summary: Поиск
      description: Отвечает 200 и возвращает `subsites`, `contents`, `lastId`. Остальные параметры и вид элементов `subsites` не изучались.
      x-status: verified
      x-evidence: [probe]
      x-checked: '2026-11-02'
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Результаты.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      subsites: { type: array, items: { type: object } }
                      contents: { type: array, items: { $ref: ./shared/schemas.yaml#/FeedItem } }
                      lastId: { type: integer }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
components:
  securitySchemes:
    JWTAuthorization: { $ref: ./shared/security.yaml#/JWTAuthorization }
  schemas:
    RecommendationItem:
      description: |
        Запись рекомендаций: `FeedItem`, у которого `meta` описана подробнее. В общей схеме `meta` — просто
        объект; здесь у неё есть поля, которых в обычной ленте не видели.
      allOf:
        - $ref: ./shared/schemas.yaml#/FeedItem
        - type: object
          properties:
            meta:
              type: object
              properties:
                feedSegment:
                  type: string
                  description: Откуда в рекомендацию попала запись.
                  examples: [rec, top24t2, ga24, my48]
                slotType: { type: string, examples: [post] }
                popularComment:
                  description: Популярный комментарий к записи; может отсутствовать.
                  allOf:
                    - $ref: ./shared/schemas.yaml#/Comment
  parameters:
    lastId:
      name: lastId
      in: query
      schema: { type: integer }
      description: "`lastId` из прошлого ответа."
    lastSortingValue:
      name: lastSortingValue
      in: query
      schema: { type: number }
      description: "`lastSortingValue` из прошлого ответа; передаётся вместе с `lastId`."
