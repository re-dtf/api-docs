openapi: 3.1.0
info:
  title: DTF API — уведомления
  version: 2026-11-02
  description: Снято по HAR сайта. reDTF показывает их в колокольчике шапки; живьём с токеном не проверялось.
servers:
  - url: https://api.dtf.ru
tags:
  - name: Уведомления
    description: Уведомления пользователя и их настройки.
paths:
  /v2.1/subsite/me/updates:
    get:
      tags: [Уведомления]
      operationId: getNotifications
      summary: Список уведомлений
      description: |
        Возвращает массив (в HAR около 19 штук одним ответом, без пагинации). Смысл `is_read=1`
        не выяснен: сайт всегда шлёт его вместе с `html=true`.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - name: html
          in: query
          schema: { type: boolean }
          description: "`true` — добавить поле `html` со ссылками."
        - name: is_read
          in: query
          schema: { type: integer, examples: [1] }
      responses:
        '200':
          description: Уведомления, свежие сверху.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { type: array, items: { $ref: ./shared/schemas.yaml#/Notification } }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/subsite/notifications/markAsRead:
    post:
      tags: [Уведомления]
      operationId: markNotificationsRead
      summary: Отметить прочитанными
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [notificationIds]
              properties:
                notificationIds:
                  type: string
                  description: JSON-массив id в виде строки.
                  examples: ['[1000000001]']
      responses:
        '200':
          description: Готово.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/user/notifications/settings:
    get:
      tags: [Уведомления]
      operationId: getNotificationSettings
      summary: Настройки уведомлений
      description: |
        Три канала: `email` (письма), `internal` (колокольчик), `push`. У каждого пункта `key` вида
        `<канал>_<событие>`, русский `title` и `enabled`. Набор пунктов задаёт сервер.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-03'
      security: [{ JWTAuthorization: [] }]
      responses:
        '200':
          description: Каналы с пунктами.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
    post:
      tags: [Уведомления]
      operationId: setNotificationSettings
      summary: Изменить настройки уведомлений
      description: |
        Поля `settings[<key>]` со значением `true` или `false`: можно один пункт, можно сразу все пункты
        канала («включить все»). В ответе все настройки уже с новыми значениями.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-03'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Ключи вида `settings[email_comment_reply]`.
              additionalProperties: { type: boolean }
      responses:
        '200':
          description: Настройки после изменения.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/user/notifications/push/subscribe:
    post:
      tags: [Уведомления]
      operationId: subscribePush
      summary: Привязать браузер для push
      description: |
        Web Push: поля `subscription[endpoint]`, `subscription[keys][p256dh]`, `subscription[keys][auth]` из
        `PushSubscription` браузера. Подписка работает только в том браузере и на том домене, где её создали
        (у сайта свой service worker). reDTF её не использует.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-03'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ['subscription[endpoint]', 'subscription[keys][p256dh]', 'subscription[keys][auth]']
              properties:
                'subscription[endpoint]': { type: string }
                'subscription[keys][p256dh]': { type: string }
                'subscription[keys][auth]': { type: string }
      responses:
        '200':
          description: Готово, `result` — пустой массив.
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/user/notifications/push/unsubscribe:
    post:
      tags: [Уведомления]
      operationId: unsubscribePush
      summary: Отвязать браузер от push
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-03'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, description: "Тот же `endpoint`, что был при подписке." }
      responses:
        '200':
          description: Готово, `result` — пустой массив.
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
components:
  securitySchemes:
    JWTAuthorization: { $ref: ./shared/security.yaml#/JWTAuthorization }
  schemas:
    NotificationSettings:
      type: object
      properties:
        message: { type: string }
        result:
          type: object
          properties:
            channels:
              type: array
              items:
                type: object
                properties:
                  key: { type: string, examples: [email] }
                  title: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, examples: [email_comment_reply] }
                        title: { type: string }
                        enabled: { type: boolean }
