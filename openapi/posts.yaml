openapi: 3.1.0
info:
  title: DTF API — посты (чтение и управление)
  version: 2026-11-02
  description: Создание и редактирование — в `editor.yaml`.
servers:
  - url: https://api.dtf.ru
tags:
  - name: Посты
    description: Чтение и управление постами.
paths:
  /v2.31/content:
    get:
      tags: [Посты]
      operationId: getContent
      security: [{}, { JWTAuthorization: [] }]
      summary: Пост по id
      description: |
        Чужой неопубликованный черновик отдаётся 403 «Недостаточно прав». Для заблокированного
        пользователя запрос проходит (200), но `commentEditor.enabled=false`.

        На `/v2.10/content` ответ того же вида; так запрашивает сайт, с `markdown=false`.
      x-status: verified
      x-evidence: [app, probe, har]
      x-checked: '2026-11-02'
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
        - name: markdown
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Пост.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Entry }
        '403': { $ref: ./shared/security.yaml#/Forbidden }
  /v2.4/content/etcControls:
    get:
      tags: [Посты]
      operationId: getContentControls
      summary: Какие действия доступны над постом
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Доступные действия.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      etcControls:
                        type: object
                        properties:
                          editEntry: { type: boolean }
                          pinContent: { type: boolean }
                          remove: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.4/content/{id}:
    delete:
      tags: [Посты]
      operationId: deleteContent
      summary: Удалить пост
      description: Работает и для опубликованных постов, и для черновиков.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Пост удалён.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      success: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/content/{id}/history:
    get:
      tags: [Посты]
      operationId: getContentHistory
      summary: История правок
      description: Список версий, свежие сверху.
      x-status: verified
      x-evidence: [app, har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Версии.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      versions:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            dateCreated: { type: integer }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/content/{id}/history/{versionId}:
    get:
      tags: [Посты]
      operationId: getContentVersion
      summary: Старая версия поста
      description: Тело `result.entry` — в формате редактора. Откат делают сохранением этой версии через `POST /v2.1/editor`.
      x-status: verified
      x-evidence: [app, har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: versionId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Версия.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      entry: { $ref: ./shared/schemas.yaml#/EditorEntry }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.10/content/{id}/react:
    post:
      tags: [Посты]
      operationId: reactToContent
      summary: Поставить или снять реакцию на пост
      description: |
        `type` — номер реакции, `0` снимает свою. Отвечает актуальными счётчиками и реакцией пользователя.
        Лайков и дизлайков у сайта больше нет, только реакции.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: ./shared/schemas.yaml#/ViewContext
                - type: object
                  required: [type]
                  properties:
                    type: { type: integer }
      responses:
        '200':
          description: Реакции после запроса.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Reactions }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
        '403': { $ref: ./shared/security.yaml#/Forbidden }
  /v2.1/favorite:
    post:
      tags: [Посты]
      operationId: addFavorite
      summary: Добавить в закладки
      description: Закладки бывают у постов (`type=1`) и у комментариев (`type=2`). Обратное действие — `removeFavorite`.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: ./shared/schemas.yaml#/ViewContext
                - $ref: ./shared/schemas.yaml#/FavoriteRequest
      responses:
        '200':
          description: Готово. `count` — сколько теперь в закладках у объекта.
          content:
            application/json:
              schema: { $ref: ./shared/schemas.yaml#/FavoriteResponse }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/unfavorite:
    post:
      tags: [Посты]
      operationId: removeFavorite
      summary: Убрать из закладок
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: ./shared/schemas.yaml#/ViewContext
                - $ref: ./shared/schemas.yaml#/FavoriteRequest
      responses:
        '200':
          description: Готово.
          content:
            application/json:
              schema: { $ref: ./shared/schemas.yaml#/FavoriteResponse }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.4/content/complaint:
    post:
      tags: [Посты]
      operationId: complainAboutContent
      summary: Пожаловаться на пост
      description: "Причины (`reason_id`): `1` спам, `2` оскорбление, `3` нарушение закона, `4` порнографический контент, `5` насилие, `6` авторские права, `7` введение в заблуждение, `8` другое, `9` политика, `10` нейроконтент. Список один на посты и комментарии."
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: ./shared/schemas.yaml#/ViewContext
                - type: object
                  required: [content_id, reason_id]
                  properties:
                    content_id: { type: integer }
                    reason_id: { type: integer }
      responses:
        '200':
          description: Жалоба принята.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.10/content/{id}/reposts:
    get:
      tags: [Посты]
      operationId: getReposts
      summary: Репосты поста
      description: |
        Записи с полями `repostId` и `repostData` (`type: osnovaEmbed`, `data.original_id`). Как репост создаётся
        (сохранение в редакторе), не снималось: есть только запись открытия `GET /v2.1/editor/0`.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{}, { JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: markdown, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Репосты.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { type: object } }
                      total: { type: integer }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.1/stats/views:
    post:
      tags: [Посты]
      operationId: sendViewStats
      summary: Статистика просмотров
      description: |
        Сайт отправляет пачку показов (JSON, не форма). reDTF этот метод не использует; `hitId` и `viewId` —
        UUID, которые сайт придумывает сам.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, examples: [content] }
                  contentId: { type: integer }
                  contentDisplayType: { type: string, examples: [full] }
                  location: { type: string, examples: [post] }
                  previousPage: { type: string }
                  fromFeed: { type: string }
                  hitId: { type: string }
                  viewId: { type: string }
      responses:
        '200':
          description: Принято.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      sessionId: { type: string }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.4/content/{id}/thread/subscribe:
    get:
      tags: [Посты]
      operationId: subscribeToComments
      summary: Подписаться на комментарии поста
      description: |
        Это GET, но он меняет состояние: включает колокольчик комментариев. Не переключатель: повторный
        вызов оставляет подписку включённой. Отписка — `thread/unsubscribe`. Текущее состояние лежит
        в поле `subscribedToTreads` записи (`GET /v2.4/content`).
      x-status: verified
      x-evidence: [har, probe]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Новое состояние подписки.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
                      subscribe: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.4/content/{id}/thread/unsubscribe:
    get:
      tags: [Посты]
      operationId: unsubscribeFromComments
      summary: Отписаться от комментариев поста
      description: |
        Это GET, но он меняет состояние: выключает колокольчик. `POST` на этот и предыдущий путь даёт 405.
        **Ответу верить нельзя**: он тот же, что у подписки (`subscribe: true`), хотя подписка снимается.
        Результат проверять по `subscribedToTreads` записи. Тот же путь отвечает и на версии `v2.1`.
      x-status: verified
      x-evidence: [probe]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Подписка выключена (поле `subscribe` в ответе при этом остаётся `true`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
                      subscribe: { type: boolean, description: "Не отражает состояние: приходит `true` и после отписки." }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
components:
  securitySchemes:
    JWTAuthorization: { $ref: ./shared/security.yaml#/JWTAuthorization }
