openapi: 3.1.0
info:
  title: DTF API — профили и подсайты
  version: 2026-11-02
  description: |
    «Подсайт» — это и пользователь, и блог, и тема. Профиль человека — подсайт типа 1.

    **Версии.** `GET /subsite` на v2.7 отдаёт профиль плоским объектом, на v2.31 — в обёртке
    `{ role, subsite }`.
servers:
  - url: https://api.dtf.ru
tags:
  - name: Профили
    description: Профили, подписки, биография, настройки профиля, чёрный список.
paths:
  /v2.31/subsite:
    get:
      tags: [Профили]
      operationId: getSubsite
      security: [{}, { JWTAuthorization: [] }]
      summary: Профиль по id или адресу
      description: |
        Вместо `id` можно передать `uri` (`games`, `cinema`, `gameindustry`, `gamedev`, `life`): так находят id тем.
        Неизвестный `uri` отвечает 404. Одно из двух обязательно.
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-02'
      parameters:
        - { name: id, in: query, schema: { type: integer } }
        - { name: uri, in: query, schema: { type: string } }
        - { name: markdown, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Профиль в обёртке.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      role: {}
                      subsite: { $ref: ./shared/schemas.yaml#/Subsite }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.7/subsite:
    get:
      tags: [Профили]
      operationId: getSubsiteFlat
      security: [{}, { JWTAuthorization: [] }]
      summary: Профиль по id (плоский ответ)
      description: Так запрашивает сайт. С токеном в ответе есть личные поля (`bannedInfo`, `userHash`, `mHash` и др.).
      x-status: verified
      x-evidence: [har, probe]
      x-checked: '2026-11-02'
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
        - { name: markdown, in: query, schema: { type: boolean }, description: "`false` — `description` приходит сырым текстом." }
      responses:
        '200':
          description: Профиль.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Subsite }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.31/subsite/me:
    get:
      tags: [Профили]
      operationId: getMe
      summary: Текущий пользователь
      description: |
        Профиль того, кто владеет токеном («кто я»). С `markdown=false` ответ — плоский объект.
        Без токена — 401.

        Форма успешного ответа взята из кода reDTF (`result.id`, `name`, `avatar`, `description`);
        в HAR этого запроса нет.
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: markdown, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Текущий профиль.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result: { $ref: ./shared/schemas.yaml#/Subsite }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/subsite/update:
    post:
      tags: [Профили]
      operationId: updateSubsite
      summary: Изменить профиль (блог, ленты, аватарка, обложка)
      description: |
        Один метод на все настройки профиля, сайт шлёт их группами, и достаточно полей группы:
        - блог: `name`, `description`, `commentingPermissions` (все три сразу);
        - ленты: `defaultFeed`, `myFeedSorting`, `isBlurNsfw`, `hideViewedPostsFromFeeds` (все четыре сразу);
        - аватарка: `avatar` — JSON элемента из `result` ответа `uploadMedia` (`{"type":"image","data":{…}}`, как есть);
        - обложка: `cover` — такой же JSON и `cover_y` (позиция, 0–100). Новая обложка идёт с `cover_y=0`,
          смена позиции шлёт тот же `cover` и новый `cover_y`, удаление — `cover=null` (строка) и `cover_y=0`.

        Если прислать один `description`, не проверялось, поэтому reDTF сначала читает профиль и возвращает
        в запросе текущие `name` и `commentingPermissions`. Работает и на `/v2.31/subsite/update`.

        Для проверки через биографию (`bio_verification` в источниках) reDTF дописывает код в
        `description` и позже убирает.
      x-status: verified
      x-evidence: [app, har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [subsiteId]
              properties:
                subsiteId: { type: integer }
                name: { type: string }
                description: { type: string }
                commentingPermissions: { $ref: ./shared/schemas.yaml#/SubsiteCommentingPermissions }
                defaultFeed: { type: string, examples: [popular], description: "Лента по умолчанию. Видели `popular`; остальные значения не сняты." }
                myFeedSorting: { type: string, examples: [new], description: "Сортировка «Моей ленты». Видели `new`." }
                isBlurNsfw: { type: boolean }
                hideViewedPostsFromFeeds: { type: boolean }
                avatar: { type: string, description: "JSON записи с `upload.dtf.ru`." }
                cover: { type: string, description: "JSON записи с `upload.dtf.ru` или строка `null`, чтобы убрать." }
                cover_y: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Сохранённые настройки.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      description: { type: string }
                      name: { type: string }
                      nickname: { type: [string, 'null'] }
                      avatar: { type: string, description: uuid }
                      cover: { type: string }
                      commentingPermissions: { type: string }
                      is_blur_nsfw: { type: boolean }
                      defaultFeed: { type: integer }
                      myFeedSorting: { type: string }
                      hideViewedPostsFromFeeds: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
        '422':
          description: |
            Не принято (например, слишком длинное описание). reDTF показывает такую ошибку как «описание слишком длинное».
  /v2.1/ignores/subsites:
    get:
      tags: [Профили]
      operationId: getIgnoredSubsites
      summary: Чёрный список (пользователи и темы)
      description: |
        Все, кого вошедший скрыл, одним списком без пагинации. Это полные профили: у пользователя `type: 1`,
        у темы `type: 2` и `subtype: community`; у темы есть `isMuted: true`.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-03'
      security: [{ JWTAuthorization: [] }]
      responses:
        '200':
          description: Скрытые.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: array
                    items: { $ref: ./shared/schemas.yaml#/Subsite }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/subsite/mute:
    post:
      tags: [Профили]
      operationId: muteSubsite
      summary: Скрыть пользователя или тему и вернуть обратно
      description: |
        Чёрный список. Один метод для пользователей и тем. `result.success` ненадёжен: при скрытии темы
        приходило `false`, хотя она попала в список, поэтому смотрите на код ответа.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-03'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, action]
              properties:
                id: { type: integer, description: id пользователя или темы. }
                action: { type: string, enum: [mute, unmute] }
      responses:
        '200':
          description: Готово.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      success: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.31/subsite/subscribers:
    get:
      tags: [Профили]
      operationId: getSubscribers
      security: [{}, { JWTAuthorization: [] }]
      summary: Подписчики
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-02'
      parameters:
        - { name: subsiteId, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Подписчики. Выдача постраничная (`lastId`, `lastSortingValue`), но reDTF берёт только первую страницу.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string }
                            avatar: { $ref: ./shared/schemas.yaml#/Media }
                            counterSubscribers: { type: integer }
                            isSubscribed: { type: boolean }
                      lastId: { type: integer }
                      lastSortingValue: { type: number }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.31/subsite/subscriptions:
    get:
      tags: [Профили]
      operationId: getSubscriptions
      security: [{}, { JWTAuthorization: [] }]
      summary: Подписки
      description: "Постраничность через `nextPage` (в проверке был `null`). Вид элементов не снят, потому что в проверочном запросе список оказался пустым; reDTF читает `id`, `name`, `avatar`, как у подписчиков."
      x-status: verified
      x-evidence: [app, probe]
      x-checked: '2026-11-02'
      parameters:
        - { name: subsiteId, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Подписки.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      items: { type: array, items: { type: object } }
                      nextPage: { type: [integer, 'null'] }
        '4XX': { $ref: ./shared/security.yaml#/ClientError }
  /v2.1/subsite/subscription:
    post:
      tags: [Профили]
      operationId: setSubscription
      summary: Подписаться или отписаться
      description: |
        Работает и для пользователей, и для тем. `location` — откуда нажали (`post` или `subsite`),
        для `post` сайт кладёт в `meta` JSON вида `{"postId": 1}`. Остальные поля — аналитика.
        `isSubscribedToNotifications=true` подписывает ещё и на уведомления о новых постах.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: ./shared/schemas.yaml#/ViewContext
                - type: object
                  required: [id, action]
                  properties:
                    id: { type: integer, description: id пользователя или темы. }
                    action: { type: string, enum: [subscribe, unsubscribe] }
                    isSubscribedToNotifications: { type: boolean }
                    meta: { type: string }
      responses:
        '200':
          description: Готово.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/subsite/notifications/subsite/subscribe/{id}:
    post:
      tags: [Профили]
      operationId: enableSubsiteNotifications
      summary: Включить уведомления о новых постах
      description: Колокольчик у того, на кого уже подписан. Тело запроса пустое.
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Включено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
                      subscribe: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
  /v2.1/subsite/notifications/subsite/unsubscribe/{id}:
    post:
      tags: [Профили]
      operationId: disableSubsiteNotifications
      summary: Выключить уведомления о новых постах
      x-status: verified
      x-evidence: [har]
      x-checked: '2026-11-02'
      security: [{ JWTAuthorization: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Выключено.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      result: { type: boolean }
                      subscribe: { type: boolean }
        '401': { $ref: ./shared/security.yaml#/Unauthorized }
components:
  securitySchemes:
    JWTAuthorization: { $ref: ./shared/security.yaml#/JWTAuthorization }
