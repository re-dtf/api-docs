<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>API DTF — Scalar</title>
</head>
<body>
	<div id="app"></div>
	<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.4/dist/browser/standalone.js"></script>
	<script>
		const areas = {
			auth: 'Вход и токены',
			feed: 'Ленты и поиск',
			posts: 'Посты',
			comments: 'Комментарии',
			subsites: 'Профили',
			notifications: 'Уведомления',
			editor: 'Редактор',
			realtime: 'WebSocket и реалтайм'
		};

		Scalar.createApiReference('#app', {
			sources: Object.entries(areas).map(([slug, title], i) => ({
				title,
				slug,
				url: `./bundle/${slug}.json`,
				default: i === 0
			})),
			// Кнопки сервисов Scalar (Share, Deploy API и др.) и «Ask AI» нам не нужны
			showDeveloperTools: 'never',
			agent: { disabled: true }
		});
	</script>
</body>
</html>
